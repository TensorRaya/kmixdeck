# kmixdeck prototype — ADR 0002 validation
# 3 channels (Game, System, Voice) × 2 mixes (Monitor, Stream) as a pure PipeWire config.
# Each (channel, mix) cell is one loopback whose playback volume is the cell's fader.
# Install to ~/.config/pipewire/pipewire.conf.d/ and restart pipewire (user).
# Node naming per ADR 0002: kmixdeck.channel.<slug>, kmixdeck.mix.<slug>, kmixdeck.link.<ch>.<mix>
# media.name is set = node.name on every stream: WirePlumber's stream-restore keys Output/Audio streams by
# media.name (falls back to node.description otherwise), so this is what makes cell volumes survive restarts
# even if the user renames a channel/mix.

context.objects = [
  # ---- Channels: null sinks apps play into
  { factory = adapter
    args = { factory.name = support.null-audio-sink  node.name = "kmixdeck.channel.game"
             node.description = "Game"    media.class = Audio/Sink  object.linger = true
             audio.position = [ FL FR ]  monitor.channel-volumes = true
             node.passive = true } }
  { factory = adapter
    args = { factory.name = support.null-audio-sink  node.name = "kmixdeck.channel.system"
             node.description = "System"  media.class = Audio/Sink  object.linger = true
             audio.position = [ FL FR ]  monitor.channel-volumes = true
             node.passive = true } }
  { factory = adapter
    args = { factory.name = support.null-audio-sink  node.name = "kmixdeck.channel.voice"
             node.description = "Voice"   media.class = Audio/Sink  object.linger = true
             audio.position = [ FL FR ]  monitor.channel-volumes = true
             node.passive = true } }

  # ---- Mixes: null sinks the cells feed; their monitor ports are what OBS / headphones consume
  { factory = adapter
    args = { factory.name = support.null-audio-sink  node.name = "kmixdeck.mix.monitor"
             node.description = "Mix: Monitor"  media.class = Audio/Sink  object.linger = true
             audio.position = [ FL FR ]  monitor.channel-volumes = true } }
  { factory = adapter
    args = { factory.name = support.null-audio-sink  node.name = "kmixdeck.mix.stream"
             node.description = "Mix: Stream"   media.class = Audio/Sink  object.linger = true
             audio.position = [ FL FR ]  monitor.channel-volumes = true } }
]

context.modules = [
  # ---- Matrix cells: channel monitor -> mix. Fader = playback stream volume (persisted by WirePlumber).
  # Game
  { name = libpipewire-module-loopback
    args = { node.description = "Game → Monitor"  capture.props = { node.name = "kmixdeck.link.game.monitor.in"  media.name = "kmixdeck.link.game.monitor.in"  node.target = "kmixdeck.channel.game"  stream.capture.sink = true  node.passive = true  node.dont-reconnect = true }
             playback.props = { node.name = "kmixdeck.link.game.monitor"  media.name = "kmixdeck.link.game.monitor"  node.target = "kmixdeck.mix.monitor"  node.dont-reconnect = true } } }
  { name = libpipewire-module-loopback
    args = { node.description = "Game → Stream"   capture.props = { node.name = "kmixdeck.link.game.stream.in"  media.name = "kmixdeck.link.game.stream.in"   node.target = "kmixdeck.channel.game"  stream.capture.sink = true  node.passive = true  node.dont-reconnect = true }
             playback.props = { node.name = "kmixdeck.link.game.stream"  media.name = "kmixdeck.link.game.stream"   node.target = "kmixdeck.mix.stream"   node.dont-reconnect = true } } }
  # System
  { name = libpipewire-module-loopback
    args = { node.description = "System → Monitor" capture.props = { node.name = "kmixdeck.link.system.monitor.in"  media.name = "kmixdeck.link.system.monitor.in" node.target = "kmixdeck.channel.system" stream.capture.sink = true node.passive = true node.dont-reconnect = true }
             playback.props = { node.name = "kmixdeck.link.system.monitor"  media.name = "kmixdeck.link.system.monitor" node.target = "kmixdeck.mix.monitor" node.dont-reconnect = true } } }
  { name = libpipewire-module-loopback
    args = { node.description = "System → Stream"  capture.props = { node.name = "kmixdeck.link.system.stream.in"  media.name = "kmixdeck.link.system.stream.in"  node.target = "kmixdeck.channel.system" stream.capture.sink = true node.passive = true node.dont-reconnect = true }
             playback.props = { node.name = "kmixdeck.link.system.stream"  media.name = "kmixdeck.link.system.stream"  node.target = "kmixdeck.mix.stream"  node.dont-reconnect = true } } }
  # Voice
  { name = libpipewire-module-loopback
    args = { node.description = "Voice → Monitor"  capture.props = { node.name = "kmixdeck.link.voice.monitor.in"  media.name = "kmixdeck.link.voice.monitor.in"  node.target = "kmixdeck.channel.voice"  stream.capture.sink = true node.passive = true node.dont-reconnect = true }
             playback.props = { node.name = "kmixdeck.link.voice.monitor"  media.name = "kmixdeck.link.voice.monitor"  node.target = "kmixdeck.mix.monitor" node.dont-reconnect = true } } }
  { name = libpipewire-module-loopback
    args = { node.description = "Voice → Stream"   capture.props = { node.name = "kmixdeck.link.voice.stream.in"  media.name = "kmixdeck.link.voice.stream.in"   node.target = "kmixdeck.channel.voice"  stream.capture.sink = true node.passive = true node.dont-reconnect = true }
             playback.props = { node.name = "kmixdeck.link.voice.stream"  media.name = "kmixdeck.link.voice.stream"   node.target = "kmixdeck.mix.stream"  node.dont-reconnect = true } } }

  # ---- Mix outputs
  # Monitor mix -> the user's headphones (follows default sink; change node.target to pin a device)
  { name = libpipewire-module-loopback
    args = { node.description = "Mix: Monitor → Headphones" capture.props = { node.name = "kmixdeck.out.monitor.in"  media.name = "kmixdeck.out.monitor.in" node.target = "kmixdeck.mix.monitor" stream.capture.sink = true node.passive = true node.dont-reconnect = true }
             playback.props = { node.name = "kmixdeck.out.monitor"  media.name = "kmixdeck.out.monitor" node.dont-reconnect = false } } }
  # Stream mix -> a virtual SOURCE that OBS/Discord can select as a microphone-like input
  { name = libpipewire-module-loopback
    args = { node.description = "Mix: Stream (capture)" capture.props = { node.name = "kmixdeck.out.stream.in"  media.name = "kmixdeck.out.stream.in" node.target = "kmixdeck.mix.stream" stream.capture.sink = true node.passive = true node.dont-reconnect = true }
             playback.props = { node.name = "kmixdeck.source.stream"  media.name = "kmixdeck.source.stream" node.description = "kmixdeck Stream Mix" media.class = Audio/Source  audio.position = [ FL FR ] } } }
]
