<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>kmixdeck</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<header id="topbar">
  <h1><img src="icon.svg" alt="" width="22" height="22"> kmixdeck</h1>
  <nav id="tabs" role="tablist">
    <button role="tab" data-view="mixer" aria-selected="true">Mixer</button>
    <button role="tab" data-view="apps">Apps</button>
    <button role="tab" data-view="patchbay">Routing</button>
    <!-- CT-8: opt-in like the scene picker above — the tab appears only once a soundboard channel exists. -->
    <button role="tab" data-view="soundboard" hidden>Soundboard</button>
  </nav>
  <div id="hearing" data-probe="hearingBar" title="What am I hearing right now"></div>
  <button id="undo" data-probe="undoAction" hidden></button>
  <span class="spacer"></span>
  <!-- CT-9: scenes. Opt-in rule (owner 2026-09-18): the recall picker is absent until a scene exists;
       "save" is the one control that is always there. -->
  <select id="scenePick" class="icon-btn" data-probe="scenePick" aria-label="Recall scene" hidden></select>
  <button id="sceneSave" class="icon-btn" data-probe="sceneSave" title="Save current faders/mutes as a scene" aria-label="Save scene">⎙</button>
  <button id="export" class="icon-btn" data-probe="exportLayout" title="Export layout (Ctrl+S)" aria-label="Export layout">⤓</button>
  <button id="import" class="icon-btn" data-probe="importLayout" title="Import layout…" aria-label="Import layout">⤒</button>
  <span id="conn" data-probe="connectionState" aria-live="polite"></span>
</header>
<main id="view"></main>
<aside id="fx-drawer" hidden aria-label="Effects"></aside>
<aside id="duck-drawer" hidden aria-label="Ducking"></aside>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
