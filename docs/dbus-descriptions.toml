#
# Prose for every member of the org.kmixdeck1 tree. tools/dbus-doc.py renders docs/dbus-api.md from these tables and
# fails when a member of interfaces/*.xml has no entry here — that is RQ-3: the contract is only finished when all of
# it is readable by someone who has never seen this repo.

[Mixer]
_intro = "The root object at `/org/kmixdeck1`. Everything else hangs below it; `GetManagedObjects` on this path returns the whole tree in one call."
Version = "Service version, e.g. `0.1.1`. Constant for the life of the process."
LastError = "Last graph-level failure the daemon could not repair on its own — an edge module that did not load (open-files limit hit, bad arguments). Empty when everything the layout asks for exists. Frontends show it as a banner; `kmixdeck status` prints it."
Connected = "True while a PipeWire connection is alive. `false` means the daemon is waiting for PipeWire — the layout is intact and re-applies itself."
OutputDevices = "Hardware sinks a mix may play to: `node.name` → human description. Unplugged devices stay in here with their last description."
InputDevices = "Hardware sources a channel may be fed by: `node.name` → description (ADR 0007)."
DevicePorts = "Per-device port list: `node.name` → the port names that device exposes (`FL`, `FR`, `AUX3`, …). Basis for the `<ref>` grammar (ADR 0009)."
HiddenDevices = "Node names hidden from every picker (CH-11). Still routable by exact name; nothing is unlinked."
SetDeviceHidden = "Hide a device from the pickers, or show it again. Returns nothing; an empty `node` is a no-op."
DefaultChannel = "Channel that never-seen applications are routed to on first appearance (CH-5). `/` disables auto-routing."
ListeningDevice = "The device *you* listen on (UX-2): a node name, or empty for the PipeWire default. Which mixes play there is decided per mix by `Mix.OutputDevice`."
UndoDescription = "What the next `Undo` would restore, as a human string (`channel “Music”`). Empty when the undo stack is empty (CH-9)."
FxTypes = "Built-in effect catalog as JSON: `[{type,label,description,params:[{key,label,unit,min,max,def}]}]` (FX-4)."
FxPresets = "One-click effect chains as JSON `{name: chain}`. A preset is a starting point — edit the chain afterwards (FX-4)."
Undo = "Restore the last removed channel or mix with its whole state: links, inputs, outputs, fader levels and mutes (CH-9). Repeated calls walk back through the stack."
Export = "Write layout and levels to `path` as one JSON document (atomic write). Returns the path written."
FirstRunPlan = "Detect hardware and propose channels/mixes as JSON — nothing is changed yet. Returns the plan for a preview."
FirstRunApply = "Apply a plan from `FirstRunPlan` (or an empty string for the automatic plan). Returns a summary of what was created."
FirstRun = "True while no layout has ever been saved — the moment a first-run assistant should offer `FirstRunPlan`."
DefaultSink = "`node.name` of the PipeWire default output. Read-only view for frontends that show what the system picks."
DefaultSource = "`node.name` of the PipeWire default input."
Import = "Load an exported JSON document from `path`, replacing channels, mixes and levels. Returns a summary. Invalid input leaves the current layout untouched."
Audition = "Solo one entity to the listening device while held (UX-12): pass a channel or mix path; `/` stops. The rest of the mix keeps running underneath."
ChannelOrder = "Channel slugs in display order."
MixOrder = "Mix slugs in display order."
MoveChannel = "Move a channel to `index` in `ChannelOrder`."
MoveMix = "Move a mix to `index` in `MixOrder`."
AddChannel = "Create a channel (input group) and return its object path. The slug is derived from `name`."
AddMix = "Create a mix and return its object path. Starts with no outputs — connect one or it stays silent."
DuplicateMix = "Copy a mix (name, icon, colour, outputs, faders) under a new name; returns the new path."
AddVirtualDevice = "Create a named block of `in` inputs + `out` outputs other software can use as a sound card; returns the node name."
RemoveVirtualDevice = "Remove a virtual device by slug or node name. Its wires go with it."
VirtualDevices = "Node names of the virtual devices this service created."
RemoveChannel = "Remove a channel and everything hanging on it. Undoable via `Undo` (CH-9)."
RemoveMix = "Remove a mix. Undoable via `Undo` (CH-9)."
Save = "Persist the layout to the service config now. Not required — every mutation saves itself — but cheap, and what a `Save` button calls."

[Channel]
_intro = "One row of the mixer: an input group at `/org/kmixdeck1/channel/<slug>`. Channels take hardware inputs and feed mixes; the per-mix level lives on the Cell."
Slug = "Lower-case ASCII id used in paths and node names. Derived from the name, stable after rename."
Name = "Label shown in every frontend."
Icon = "Freedesktop icon name or absolute file path (UX-8). Empty = frontend default."
Color = "Colour code `#rrggbb`, empty for the theme default (MX-5). Anything else is rejected."
Group = "Optional grouping label for frontends that stack rows by group. Empty = one flat list."
Trim = "Channel-wide trim before every mix, linear 0…1 (CH-7). This is *not* the per-mix fader — that is the Cell."
Pan = "Stereo position: −1 left, 0 centre, +1 right, constant-power law on the channel sink (DV-22)."
Muted = "Channel mute, applied on top of every cell."
NodeName = "PipeWire node name of the channel sink, for tools that link things themselves."
InputDevice = "What feeds this channel, in `<ref>` grammar (`node.name[:PORT[,PORT]][>L|>R]`, ADR 0009). Empty = no hardware input."
InputPresent = "False while `InputDevice` is set but the device is unplugged: grey the row out, keep the value (DV-9)."
Inputs = "Every wire of this channel as `<ref>` strings, in order."
SetWireTrim = "Set trim and mute of one wire. Returns false when the ref is unknown."
WireTrim = "Trim of one wire, linear 0…1."
WireMuted = "Per-wire mute — for a stereo pair where only one side should be audible."
AddInput = "Add a wire to a second device or port; returns false if the ref does not exist."
RemoveInput = "Remove one wire; returns false when it was not wired."
FxChain = "Effect chain as JSON: `{effects:[{type,label,params,bypass}]}`. Empty object = no effects."
ToggleMute = "Atomic mute flip — what a hotkey or a Stream Deck key calls, no read-modify-write race."
SetFx = "Replace the whole chain. Validates first; errors come back as a D-Bus error instead of a silent half-state. `{}` clears."
SetFxControl = "Live-tweak one control without rebuilding the chain. Key is the full control name from the chain JSON, e.g. `gate:Threshold (dB)`."

[Mix]
_intro = "One column of the mixer: an output group at `/org/kmixdeck1/mix/<slug>`. A mix sums its cells and plays to one or more hardware outputs."
Slug = "Lower-case ASCII id used in paths and node names."
Name = "Label shown in every frontend."
Icon = "Freedesktop icon name or absolute file path (UX-8). Empty = frontend default."
Color = "Colour code `#rrggbb`, empty for the theme default (MX-5)."
OutputDevice = "Hardware the mix plays to, in `<ref>` grammar. Unlike a plain mixer this is per mix, not global."
CaptureSource = "Node name of the virtual capture source exposing this mix for other software, or empty (MX-3b)."
NodeName = "PipeWire node name of the mix source."
OutputPresent = "False while `OutputDevice` is set but unplugged. The mix is parked and returns by itself (DV-9..12)."
Outputs = "Every wire of this mix as `<ref>` strings."
OutputDescriptions = "Parallel to Outputs: last seen description per entry, so a frontend can name an unplugged device (DV-9)."
AddOutput = "Add a hardware destination next to the existing ones (multiboxing)."
SetWireTrim = "Trim and mute for one output wire; returns false for an unknown ref."
WireTrim = "Trim of one output wire, linear 0…1."
WireMuted = "Per-output-wire mute."
RemoveOutput = "Remove one output wire. The last one can be removed — then the mix is silent except for `FallbackOutput`."
FallbackOutput = "Where to play while every entry of Outputs is unplugged (DV-15). Empty means silence — never silently the system default."
Volume = "Master fader of the mix, linear 0…1 (MX-6): applies to every hardware output and to the capture source alike."
Muted = "Mix mute on top of the master."
ToggleMute = "Atomic mute flip for keys and remotes."
FxChain = "Same chain contract as on Channel (FX-6); a limiter on the Stream mix is the common case."
SetFx = "Replace the chain; validates first. `{}` clears."
SetFxControl = "Live-tweak one control by full key."

[Cell]
_intro = "One crossing: `/org/kmixdeck1/cell/<channel>/<mix>`. That is where a channel's level into one mix lives — the fader you drag."
Channel = "Object path of this cell's channel."
Mix = "Object path of this cell's mix."
Volume = "Fader level, linear 0…1: 0.25 = −12.04 dB, 0.5 = −6.02 dB, 1 = unity."
Muted = "Cell mute."
SetVolumeDb = "Same fader in dB (≤ 0) — convenience for scripts. `−inf` passes as −1e9."
ToggleMute = "Atomic mute flip; keys do not need to read first."
Follows = "Cell this one mirrors (level and mute), or `/`. The mirrored cell stops being driven by its own fader while set."

[App]
_intro = "One application stream at `/org/kmixdeck1/app/<id>`, discovered from PipeWire. Read-only except routing."
Name = "Application name from the stream."
Binary = "Process binary of the stream, for grouping several streams of one app."
MediaName = "`media.name` — the stream label the app chose."
MediaRole = "`media.role`, e.g. `Music`, `Communication`, `Phone`. Used for sensible default routing."
NodeId = "PipeWire node id, unique per session."
Icon = "`application.icon-name` of the stream (UX-10). Empty = frontend default."
Running = "True while the stream produces sound (node state `running`). A paused stream is not running."
Channels = "Object paths of every channel this stream currently feeds."
Channel = "Its single channel as an object path, or `/` when it plays somewhere outside kmixdeck."
MoveTo = "Move the stream to one channel and remember the choice via WirePlumber's restore-target (CH-4)."
Assign = "Put the stream on several channels at once. `add_on` merges with the current set; false replaces it."

[Levels]
_intro = "Meter data for `/org/kmixdeck1/levels`. One shared set of meter streams feeds every caller — subscribe, then listen for `Peaks`."
Rate = "Tick rate of the `Peaks` signal in Hz."
Subscribers = "Number of subscribed clients. Zero means no meter streams exist at all."
Subscribe = "Start meters for this caller. Idempotent."
Unsubscribe = "Stop meters for this caller; the last one tears the meter streams down."
Peaks = "One tick: bus key → peak level linear 0…1. Keys: `channel/<s>`, `mix/<s>`, `cell/<c>/<m>` (post-fader), `in/<s>`, `out/<m>` (post master), `app/<id>`; `rms/` and `clip/` prefixes carry the CH-7 companions."
