name: build-and-test
on:
  push: { branches: [main, "release/**"] }
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain, KDE Frameworks 6, PipeWire (same packages as the dev box)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq cmake ninja-build g++ pkg-config extra-cmake-modules \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-svg-dev \
            qml6-module-org-kde-kirigami libkirigami-dev kirigami-addons-dev \
            qml6-module-org-kde-kirigamiaddons-components qml6-module-org-kde-kirigamiaddons-formcard \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            libkf6coreaddons-dev libkf6config-dev libkf6i18n-dev libkf6globalaccel-dev \
            libkf6statusnotifieritem-dev libkf6notifications-dev libkf6dbusaddons-dev libkf6crash-dev \
            libkf6iconthemes-dev libkf6qqc2desktopstyle-dev libkf6colorscheme-dev liblayershellqtinterface-dev \
            libpipewire-0.3-dev ladspa-sdk libebur128-dev libavformat-dev libavcodec-dev libswresample-dev pipewire pipewire-audio wireplumber pipewire-bin \
            ffmpeg python3-pytest python3-gi python3-websockets appstream dbus dbus-daemon systemd swh-plugins \
            python3-venv ca-certificates curl
          # Ubuntu 26.04 has neither as a .deb: `chromium` does not exist, `chromium-browser` is a snap stub (no snapd
          # in a container), `ruff` has no candidate. apt exited 100 on every run since 2026-09-18, so CI never built.
          # Chrome: Google's own .deb, same browser as the dev box. ruff: pinned to the dev box's version.
          curl -fsSLo /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          apt-get install -y -qq /tmp/chrome.deb
          # Only the ruff binary goes on PATH, never the venv's bin/: with /opt/lint/bin first, `python3` was the venv's
          # interpreter without python3-websockets, and the Stream Deck plugin (run.sh: `exec python3 plugin.py`)
          # died on `import websockets` — test_ct3 timed out waiting for registerPlugin (CI run 37369020745).
          python3 -m venv /opt/lint && /opt/lint/bin/pip install -q ruff==0.15.22
          ln -s /opt/lint/bin/ruff /usr/local/bin/ruff
      - name: Lint (BP-4 — the build is -Werror, this is the same gate for Python and the workflow itself)
        run: |
          ruff check .
          python3 tools/sot-audit.py
          python3 tools/dbus-doc.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: ninja -C build
      - name: Unit tests
        run: ctest --test-dir build -LE integration --output-on-failure
      - name: Integration tests (private PipeWire daemon, no sound card)
        # serial, like the release gate locally (BP-6): the suites measure audio levels and timing; four PipeWire
        # daemons on one runner made green/red depend on scheduling, not on the code
        run: ctest --test-dir build -L integration --output-on-failure --timeout 900
      - name: Smoke-start the app offscreen
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg && mkdir -p $XDG_RUNTIME_DIR && chmod 700 $XDG_RUNTIME_DIR
          # The app uses KDBusService (single instance) → needs a session bus, like on any desktop.
          QT_QPA_PLATFORM=offscreen dbus-run-session -- sh -c './build/bin/kmixdeckd & timeout 5 ./build/bin/kmixdeck-kde; test $? -eq 124'
